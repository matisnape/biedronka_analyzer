[project]
name = "biedronka"
version = "0.1.0"
description = "Scrape Moja Biedronka receipts into a local archive for price analysis"
requires-python = ">=3.11"
dependencies = ["playwright>=1.48"]

[project.scripts]
biedronka = "biedronka.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
